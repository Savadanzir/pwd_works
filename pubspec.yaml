
name: road_maintenance
description: Road Maintenance Reporting App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  provider: ^6.1.1
  image_picker: ^1.0.5
  geolocator: ^10.1.0
  intl: ^0.19.0
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  audioplayers: ^5.2.1
  http: ^1.1.0
  latlong2: ^0.9.1
  flutter_map: ^6.1.0
  geocoding: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
     - lib/assets/images/road_logo.png
     - lib/assets/icons/images.jpeg
  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "D:/irohub/main project/pwd_road_work/lib/assets/icons/images.jpeg"
  min_sdk_android: 21
